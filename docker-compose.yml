# Local production-like stack: app + Postgres.
#   SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(32))") docker compose up --build
#   docker compose exec app python create_user.py admin --admin
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DATABASE_URL: postgresql+psycopg2://auth:${POSTGRES_PASSWORD:-auth}@db:5432/auth
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth}
      POSTGRES_DB: auth
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
